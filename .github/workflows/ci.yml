name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

jobs:
  build-and-test:
    name: Build, unit tests, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev gcovr
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            ~/.cache
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-
      - name: Configure (coverage on)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEMRS_COVERAGE=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report (line + branch)
        run: |
          mkdir -p coverage
          gcovr -r . --filter 'src/' --exclude 'src/main.cpp' --txt --print-summary \
                --html-details coverage/index.html --branches --txt-metric branch \
                > coverage/summary.txt || true
          gcovr -r . --filter 'src/' --exclude 'src/main.cpp' --print-summary
          gcovr -r . --filter 'src/' --exclude 'src/main.cpp' --txt-metric branch --print-summary
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "### Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  frontend-tests:
    name: Frontend tests (pytest + Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-deps-
      - name: Build server
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DEMRS_BUILD_TESTS=OFF
          cmake --build build -j"$(nproc)" --target emrs_server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/frontend/requirements.txt
      - name: Install pytest and Playwright
        run: |
          pip install -r tests/frontend/requirements.txt
          playwright install --with-deps chromium
      - name: Run frontend tests
        run: pytest -v

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: cppcheck
        run: cppcheck --enable=warning,performance,portability --std=c++17 --error-exitcode=1 --inline-suppr -I src src tests

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emrs:ci .
      - name: Smoke test container
        run: |
          docker run -d --name emrs -p 8080:8080 emrs:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs emrs; exit 1
