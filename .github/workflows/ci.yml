name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

jobs:
  build-and-test:
    name: Build, unit tests, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Run unit & API tests (Node.js)
        run: npm --prefix backend test
      - name: Build React frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

  frontend-tests:
    name: Frontend tests (pytest + Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/frontend/requirements.txt
      - name: Install pytest and Playwright
        run: |
          pip install -r tests/frontend/requirements.txt
          playwright install --with-deps chromium
      - name: Run frontend tests
        run: pytest -v

  static-analysis:
    name: Static analysis (JavaScript syntax & lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript files syntax
        run: |
          node --check backend/src/server.js
          node --check backend/src/app.js
          node --check backend/src/util/validation.js

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emrs:ci .
      - name: Smoke test container
        run: |
          docker run -d --name emrs -p 8080:8080 emrs:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs emrs; exit 1
