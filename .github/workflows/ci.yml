name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, unit tests, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix backend ci
      - name: Run unit & API tests with coverage
        run: npm --prefix backend test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend unit tests
        run: npm --prefix frontend test
      - name: Build React frontend
        run: npm --prefix frontend run build

  static-analysis:
    name: Static analysis (JavaScript syntax & lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Validate server syntax
        run: |
          node --check backend/src/server.js
          node --check backend/src/app.js
          node --check backend/src/util/validation.js

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emrs:ci .
      - name: Smoke test container
        run: |
          docker run -d --name emrs -p 8080:8080 emrs:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/api/health && exit 0; sleep 1; done
          docker logs emrs; exit 1
